<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLYMPICUS API</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0b1b3a 0%, #123a6b 100%);
      color: #e6edf7;
    }
    main {
      text-align: center;
      max-width: 720px;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.5rem; font-size: 2.4rem; letter-spacing: 1px; }
    h1 span { color: #4ec5ff; }
    p.subtitle { opacity: 0.85; margin: 0 0 2rem; }
    .links a {
      display: inline-block;
      margin: 0.4rem;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      background: #2b6cb0;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover { background: #3273c9; }
    .links a.secondary {
      background: transparent;
      border: 1px solid #4ec5ff;
      color: #4ec5ff;
    }
  </style>
  <style>
    #verificar {
      max-width: 720px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    #verificar h2 {
      margin-top: 0;
      color: #4ec5ff;
    }
    .buscador {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .buscador input {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
    }
    .buscador button {
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: #2b6cb0;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .buscador button:hover {
      background: #3273c9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.8rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      color: #4ec5ff;
      font-weight: 600;
    }
    .error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <main>
    <h1>OLYMPICUS<span>API</span></h1>
    <p class="subtitle">Sistema de Inventario y Ventas · REST + OpenAPI/Swagger · 24/7 en Cloudflare Workers</p>
    <nav class="links">
      <a href="/docs">Documentación interactiva (Swagger UI)</a><br>
      <a class="secondary" href="/openapi.json">openapi.json</a>
      <a class="secondary" href="/openapi.yaml">openapi.yaml</a>
    </nav>
  </main>

  <section id="verificar">
    <h2>Verificar Productos</h2>
    <div class="buscador">
      <input type="number" id="buscarId" placeholder="Buscar por ID">
      <button onclick="buscarProducto()">Buscar</button>
      <button onclick="cargarTodos()">Ver todos</button>
    </div>
    <div id="resultado"></div>
  </section>

  <script>
    async function cargarTodos() {
      const div = document.getElementById('resultado');
      div.innerHTML = 'Cargando...';
      try {
        const res = await fetch('/api/productos');
        if (!res.ok) throw new Error('Error al cargar');
        const data = await res.json();
        if (data.length === 0) {
          div.innerHTML = '<p>No hay productos registrados</p>';
          return;
        }
        div.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(p => `
                <tr>
                  <td>${p.id}</td>
                  <td>${p.nombre}</td>
                  <td>${p.descripcion || '-'}</td>
                  <td>$${p.precio.toFixed(2)}</td>
                  <td>${p.stock}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        div.innerHTML = '<p class="error">Error al cargar los productos</p>';
      }
    }

    async function buscarProducto() {
      const id = document.getElementById('buscarId').value;
      const div = document.getElementById('resultado');
      if (!id) {
        div.innerHTML = '<p class="error">Ingrese un ID válido</p>';
        return;
      }
      div.innerHTML = 'Buscando...';
      try {
        const res = await fetch(`/api/productos/${id}`);
        if (res.status === 404) {
          div.innerHTML = '<p class="error">Producto no encontrado</p>';
          return;
        }
        if (!res.ok) throw new Error('Error al buscar');
        const p = await res.json();
        div.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${p.id}</td>
                <td>${p.nombre}</td>
                <td>${p.descripcion || '-'}</td>
                <td>$${p.precio.toFixed(2)}</td>
                <td>${p.stock}</td>
              </tr>
            </tbody>
          </table>
        `;
      } catch (e) {
        div.innerHTML = '<p class="error">Error al buscar el producto</p>';
      }
    }
  </script>
</body>
</html>
